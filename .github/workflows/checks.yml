name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DrillShapeTests/DrillShapeTests.csproj -c Release
# Full Mod builds require privately installed game assemblies and CUCoreLib.
# These checks do not claim game loading, gameplay, save reload or multiplayer PASS.
